    "`unwrap_or(x)` évalue `x` même quand tout va bien : pour un calcul coûteux, `unwrap_or_else(|| ...)` ne paie que sur l’échec.",
    "Dans les tests, unwrap est idiomatique : un test qui panique est un test rouge, c’est exactement le comportement voulu.",
    "`#![deny(clippy::unwrap_used)]` bannit unwrap de tout le crate — pratique pour durcir du code de production.",
    "`ok()` jette l’erreur sans bruit : si la cause de l’échec compte un jour, garde le Result.",
]
