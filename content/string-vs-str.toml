    "Convertir pour comparer : String == &str marche directement (PartialEq est implémenté entre les deux).",
    "Oublier que les littéraux sont des &'static str : ils vivent aussi longtemps que le programme tourne.",
    "Vouloir modifier un &str : impossible, c'est une vue en lecture — modifie la String d'origine, puis re-emprunte.",
]
