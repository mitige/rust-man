    "Corriger sans avoir reproduit : tu ne sauras jamais si le bug est parti ou juste caché sous le tapis.",
    "Changer le code ET l'entrée en même temps : deux variables à la fois, zéro conclusion possible.",
    "Demander de l'aide avec « ça marche pas » : donne attendu/observé/changé, sinon personne ne peut rien pour toi.",
]
