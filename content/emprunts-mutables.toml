    "Pousser dans un Vec pendant qu'on itère dessus : le compilateur refuse, un &mut ne cohabite pas avec le & de l'itérateur.",
    "Penser que la règle ne sert qu'en multithread : elle protège aussi itérateurs et références en mono-thread.",
