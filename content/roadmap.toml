description = '''
## En une phrase

Huit semaines, du premier `cargo new` au projet final, **calées sur un cours universitaire** : chaque semaine a ses fiches, ses quiz et ses exercices.

## En pratique

Le parcours suit l'ordre où les notions se débloquent les unes les autres :

```text
S01  prise en main + variables      S05  traits + generics + closures
S02  contrôle + structs             S06  erreurs custom + crates
S03  ownership + Option             S07  objets-trait + avancé
S04  emprunts + Result + collections  S08  projet final
```

Semaine par semaine :

1. **S01** — Lis `installer-rust`, `premier-programme`, `variables-mutabilite`, `types-scalaires`. Objectif : compiler sans cargo, puis avec.
2. **S02** — Lis `lire-la-doc`, `fonctions`, `expressions-vs-instructions`, `conditions`, `boucles`, `structs`. Objectif : un petit programme avec des structs.
3. **S03** — Lis `ownership`, `clone-copy`, `option`. C'est LA semaine charnière : prends ton temps.
4. **S04** — Lis `emprunts`, `emprunts-mutables`, `result`, `operateur-question`, `vec`, `hashmap`. Objectif : un programme qui gère ses erreurs proprement.
5. **S05** — Lis `traits`, `derive`, `generics`, `closures`, `iterateurs`.
6. **S06** — Lis `erreurs-custom`, `cargo-toml`, `crates-io`, `tests`. Objectif : publier une crate locale testée.
7. **S07** — Lis `dyn-trait`, `lifetimes`, `trait-bounds`, `iter-avance`.
8. **S08** — Projet final avec `structurer-projet`, `idiomes-rust`, `methodologie-debug`. Combine tout : structs, erreurs, traits, tests.

En parallèle : quiz chaque semaine, et `methode-apprentissage` dès maintenant pour la cadence.

## À retenir

- S03 (ownership) est le tournant : tout ce qui précède la prépare, tout ce qui suit s'appuie dessus.
- Une semaine = un lot de fiches + un quiz + les exercices des fiches.
- Prends du retard sur la roadmap plutôt que de bâcler ownership.
- S08 ne demande rien de nouveau : elle assemble ce que S01-S07 ont posé.
'''
