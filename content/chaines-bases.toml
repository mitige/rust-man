synopsis = "let mut s = String::from(\"bonjour\"); s.push_str(\" le monde\");  // len() compte des OCTETS"
description = '''
## En une phrase

`String` est un texte **possédé et modifiable** sur le tas, `&str` une **vue empruntée** sur du texte — et les deux parlent UTF-8, ce qui change tout.

## En pratique

1. **Créer** : trois portes d'entrée quotidiennes :

```rust
let a = String::from("bonjour");  // String possédée
let b = "salut".to_string();      // conversion depuis un littéral
let c: &str = "coucou";           // vue sur un littéral (stocké dans le binaire)
```

2. **Faire grandir** : `push_str` ajoute un `&str` à une `String` mutable (il existe aussi `push` pour un seul `char`) :

```rust
let mut s = String::from("bon");
s.push_str("jour");
```

3. **Assembler sans déplacer** : `format!` fabrique une **nouvelle** `String` et laisse les originaux intacts — l'équivalent du f-string de Python :

```rust
let titre = format!("{a} et {b}");
```

4. **`len()` compte des OCTETS.** En UTF-8, `é` occupe 2 octets : `"été".len()` vaut **5**, pas 3. Pour compter les caractères : `s.chars().count()`.

5. **Pas d'indexation `s[0]`.** Le compilateur refuse, et il a raison : un octet isolé peut couper un caractère en deux. Que voudrait dire `s[0]` — un octet ? un caractère ? Rust refuse de choisir à ta place.

6. **Itérer proprement** : `.chars()` pour les caractères, `.bytes()` pour les octets bruts :

```rust
for ch in "été".chars() { /* 'é', puis 't', puis 'é' */ }
```

Pour le duel complet possession vs emprunt (quel type prendre en paramètre, pourquoi `&String` se convertit en `&str`...), file à la fiche `string-vs-str`.

## À retenir

- `String::from`, `.to_string()`, littéral `&str` : trois créations pour deux types différents.
- `push_str` modifie une `String` ; `format!` en crée une nouvelle sans rien déplacer.
- `len()` = octets UTF-8, **jamais** des caractères : `"été".len()` == 5.
- `s[0]` ne compile pas : l'UTF-8 rend l'indexation par position ambiguë et dangereuse.
- `.chars()` itère les caractères, `.bytes()` les octets — choisis consciemment.
- Possession vs emprunt, conversion `&String` → `&str` : voir `string-vs-str`.
'''
example = '''
fn main() {
    // Trois façons de créer du texte
    let a = String::from("bonjour"); // String : possédée, sur le tas
    let b = "salut".to_string();     // conversion depuis un littéral
    let c: &str = "coucou";          // &str : vue empruntée sur un littéral

    // push_str ajoute un &str à une String (qui doit être mut)
    let mut message = a;
    message.push_str(" le monde");
    println!("{message} | {b} | {c}");

    // format! construit une NOUVELLE String sans toucher aux originaux
    let titre = format!("{b}, {c} !");
    println!("titre : {titre}");

    // len() compte des OCTETS, pas des caractères — UTF-8 oblige
    let mot = String::from("été");
    println!("{mot} : {} octets, {} caractères", mot.len(), mot.chars().count());

    // mot[0] serait refusé à la compilation : un octet n'est pas un caractère
    // On itère caractère par caractère avec .chars()
    for ch in mot.chars() {
        println!("  caractère : {ch}");
    }

    // .bytes() existe aussi, pour les octets bruts
    println!("octets de {mot} : {:?}", mot.bytes().collect::<Vec<u8>>());
}
'''
