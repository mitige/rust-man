    "`+` existe entre `String` et `&str` (`s1 + &s2`) mais **déplace** `s1` ; `format!` ne déplace rien.",
    "Un littéral `\"...\"` est un `&'static str`, pas une `String` : `push_str` n'existe pas dessus.",
    "`.chars().count()` est en O(n) : l'UTF-8 à taille variable oblige à tout parcourir pour compter.",
    "Couper avec `&s[..n]` à un index qui n'est pas une frontière de caractère panique à l'exécution.",
]
