    "Nommer les fichiers en CamelCase : les modules/fichiers sont en snake_case ; ce sont les TYPES qui sont en CamelCase.",
    "Créer un cargo workspace pour un TP de 300 lignes : un seul crate avec des modules suffit largement.",
    "Mettre les tests unitaires dans tests/ : ce dossier est réservé à l'intégration ; l'unitaire vit à côté du code.",
