synopsis = "fn aire(l: u32, h: u32) -> u32 { l * h }  // dernière expression sans ; = valeur de retour"
description = '''
## En une phrase

Une fonction Rust **annonce exactement ce qu'elle prend et ce qu'elle rend** : types des paramètres obligatoires, type de retour après `->`, corps évalué comme une expression.

## En pratique

1. Déclaration : `fn nom(param: Type, autre: Type) -> Retour { ... }`.
2. Les types des paramètres sont OBLIGATOIRES : Rust n'infère jamais une signature (l'inférence ne vit qu'à l'intérieur du corps).
3. Sans `-> Type`, le retour est le type unit `()` : la fonction « ne renvoie rien ».
4. Le corps est un bloc-expression : la DERNIÈRE expression, sans `;`, est la valeur renvoyée.

```rust
fn carre(n: i32) -> i32 {
    n * n // pas de ; ici : c'est le retour
}
```

5. `return expr;` sert aux sorties précoces en plein milieu du corps ; en fin de fonction, préfère l'expression nue — c'est l'idiome Rust.
6. Nommage : snake_case (aire_rectangle, pas aireRectangle). Le compilateur avertit sinon.
7. Une fonction peut être définie DANS une autre fonction — pratique pour un helper local. Mais elle ne capture pas les variables autour d'elle (pour ça, il faudra les closures).

## À retenir

- fn nom(param: Type) -> Retour : tout est annoncé dans la signature
- sans ->, le retour est ()
- dernière expression sans ; = valeur de retour
- return = sortie précoce, pas fin de fonction idiomatique
- snake_case, sinon avertissement du compilateur
- fn imbriquée possible, mais sans capture de variables locales
'''
example = '''
// Rust impose le type des paramètres ET celui du retour
fn aire_rectangle(largeur: u32, hauteur: u32) -> u32 {
    largeur * hauteur // expression finale : pas de point-virgule
}

// return sert surtout à sortir tôt
fn est_valide(score: i32) -> bool {
    if score < 0 {
        return false; // sortie anticipée
    }
    score <= 100 // expression de retour, idiomatique
}

// sans ->, la fonction renvoie le type unit ()
fn affiche_resume(nom: &str, score: i32) {
    // une fonction peut en contenir une autre
    fn barre(n: i32) -> String {
        "█".repeat(n.max(0).min(10) as usize)
    }
    println!("{nom} : {} ({score}/100)", barre(score / 10));
}

fn main() {
    let a = aire_rectangle(6, 7);
    println!("aire du rectangle : {a}");

    for s in [120, 42, -3] {
        println!("score {s} valide ? {}", est_valide(s));
    }

    affiche_resume("Ada", 75);
}
'''
