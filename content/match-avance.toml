    "Écrire `1..=10` et vouloir utiliser la valeur : un intervalle ne nomme rien, il faut un binding `y @ 1..=10`.",
    "Matcher une `String` avec des patterns String : matche `s.as_str()` contre des littéraux `&str`.",
    "Enchaîner trois `if let ... else if let ...` : passé deux cas, un vrai `match` est plus lisible et vérifie l'exhaustivité.",
    "Oublier que le bloc `else` d'un let-else doit diverger : `return`, `break`, `continue` ou `panic!`, jamais une valeur.",
]
