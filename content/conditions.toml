    "let x = if c { 1 }; sans else ne compile pas : le bras manquant vaudrait (), pas i32.",
    "if c { 1 } else { \"un\" } : bras de types différents, erreur de compilation assurée.",
    "L'affectation dans la condition n'existe pas : if x = 5 est une erreur de syntaxe, pas un bug silencieux comme en C.",
