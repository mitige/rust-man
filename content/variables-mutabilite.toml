    "Après un shadowing, l'ancienne valeur est masquée mais pas détruite : une référence prise avant reste valide.",
    "Une const n'accepte ni mut ni valeur calculée à l'exécution : tout doit être connu à la compilation.",
    "static mut est unsafe : y toucher exige un bloc unsafe, garde ça pour plus tard.",
    "Masquer une variable par accident (un let de trop) la rend silencieusement inaccessible : nomme clairement.",
]
